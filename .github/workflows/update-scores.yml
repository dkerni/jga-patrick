name: Update Scores

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action: add_challenge | remove_challenge | finish | reset'
        required: true
        type: choice
        options:
          - add_challenge
          - remove_challenge
          - finish
          - reset
      challenge_name:
        description: 'Challenge name (for add_challenge / remove_challenge)'
        required: false
        type: string
      challenge_type:
        description: 'Challenge type: standard | zusatz (for add_challenge)'
        required: false
        type: choice
        options:
          - standard
          - zusatz
      score:
        description: 'Score 0-5 (for add_challenge)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update scores.json
        env:
          ACTION: ${{ github.event.inputs.action }}
          CHALLENGE_NAME: ${{ github.event.inputs.challenge_name }}
          CHALLENGE_TYPE: ${{ github.event.inputs.challenge_type }}
          SCORE: ${{ github.event.inputs.score }}
        run: |
          python3 - <<'EOF'
          import json, os, sys

          with open('data/scores.json', 'r') as f:
              data = json.load(f)

          action = os.environ['ACTION']

          if action == 'add_challenge':
              name = os.environ.get('CHALLENGE_NAME', '').strip()
              ctype = os.environ.get('CHALLENGE_TYPE', 'standard').strip()
              score = os.environ.get('SCORE', '').strip()
              if not name:
                  print('ERROR: challenge_name is required')
                  sys.exit(1)
              if not score:
                  print('ERROR: score is required')
                  sys.exit(1)
              score = int(score)
              if score < 0 or score > 5:
                  print('ERROR: score must be 0-5')
                  sys.exit(1)
              if ctype not in ('standard', 'zusatz'):
                  ctype = 'standard'
              data['challenges'].append({
                  'name': name,
                  'type': ctype,
                  'score': score
              })
              print(f'Added challenge: {name} ({ctype}) with score {score}')

          elif action == 'remove_challenge':
              name = os.environ.get('CHALLENGE_NAME', '').strip()
              if not name:
                  print('ERROR: challenge_name is required')
                  sys.exit(1)
              before = len(data['challenges'])
              data['challenges'] = [c for c in data['challenges'] if c['name'] != name]
              if len(data['challenges']) == before:
                  print(f'ERROR: challenge "{name}" not found')
                  sys.exit(1)
              print(f'Removed challenge: {name}')

          elif action == 'finish':
              data['finished'] = True
              print('Marked as finished')

          elif action == 'reset':
              data = {'finished': False, 'challenges': []}
              print('Reset data')

          with open('data/scores.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          git diff --cached --quiet || git commit -m "chore: update scores [${{ github.event.inputs.action }}]"
          git push
